name: Bug 报告
description: 报告可复现的 MinView 行为问题
title: "fix: "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: 问题摘要
      description: 简要说明实际行为及其影响。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 按下……
        3. 观察到……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: Windows 版本、DPI/缩放比例、显示器、图片格式与文件规模。
      placeholder: Windows 11 24H2；3840×2160；200% DPI；PNG；约 2,000 张
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 证据
      description: 截图、录屏、崩溃信息或最小测试文件。请先移除敏感数据。
  - type: dropdown
    id: regression
    attributes:
      label: 是否为回归
      options:
        - 未知
        - 是，旧版本正常
        - 否，从未正常
    validations:
      required: true
